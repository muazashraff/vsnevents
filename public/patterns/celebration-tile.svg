<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110">
  <defs>
    <!-- tiered celebration cake: three stacked tiers, drip lines, tiny flag topper -->
    <g id="cake">
      <path d="M -14 0 Q 0 2 14 0 L 11 10 Q 0 12 -11 10 Z" />
      <path d="M -9 -9 Q 0 -7 9 -9 L 7 0 Q 0 2 -7 0 Z" />
      <path d="M -5 -17 Q 0 -15.5 5 -17 L 4 -9 Q 0 -7.5 -4 -9 Z" />
      <path d="M -13 3.5 Q 0 6.5 13 3.5" />
      <path d="M -8 -5.5 Q 0 -3 8 -5.5" />
      <line x1="0.3" y1="-17" x2="1" y2="-25" />
      <path d="M 1 -25 L 7.5 -21.5 L 1 -18.5 Z" fill="#B08A4E" stroke="none" />
    </g>

    <!-- hand-tied bloom cluster -->
    <g id="bloom">
      <path d="M -6 -14 Q -11 -12 -10 -7 Q -9 -3 -5 -4 Q -1 -5 -2 -10 Q -3 -14 -6 -14 Z" />
      <path d="M 4 -16 Q -1 -15 -1 -10 Q -1 -6 3 -6 Q 7 -7 7 -12 Q 7 -16 4 -16 Z" />
      <path d="M 0 -6 Q -6 -5 -5 0 Q -4 4 1 3 Q 6 2 5 -3 Q 4 -6 0 -6 Z" />
      <path d="M 10 -6 Q 5 -6 5 -1 Q 5 3 9 3 Q 13 2 13 -2 Q 13 -6 10 -6 Z" />
      <path d="M -5 -2 Q -3 5 -1 11" />
      <path d="M 0 0 Q 0 6 1 11" />
      <path d="M 9 -1 Q 6 5 4 11" />
      <path d="M -3.5 9 Q 1 10.5 5.5 9" />
    </g>

    <!-- striped ribbon bow -->
    <g id="bow">
      <path d="M -1.5 0 C -6 -9 -15 -8 -13.5 -1 C -12.5 3.5 -5 3 -1.5 0 Z" />
      <path d="M 1.5 0 C 6 -9 15 -8 13.5 -1 C 12.5 3.5 5 3 1.5 0 Z" />
      <path d="M -1.5 0.5 L -6 10" />
      <path d="M 1.5 0.5 L 6 10" />
      <path d="M -6 6.5 L -4.3 8.7" />
      <path d="M 6 6.5 L 4.3 8.7" />
      <circle cx="0" cy="0.5" r="2.3" />
      <path d="M -9 -4 L -6.5 -6.5" />
      <path d="M -6 -1.5 L -3.5 -4" />
      <path d="M 9 -4 L 6.5 -6.5" />
      <path d="M 6 -1.5 L 3.5 -4" />
    </g>

    <!-- tiny quatrefoil accent dot -->
    <g id="quatrefoil">
      <path d="M 0 -4.5 C 2.4 -2.4 2.4 2.4 0 4.5 C -2.4 2.4 -2.4 -2.4 0 -4.5 Z" />
      <path d="M -4.5 0 C -2.4 -2.4 2.4 -2.4 4.5 0 C 2.4 2.4 -2.4 2.4 -4.5 0 Z" />
    </g>

    <!-- loose botanical sprig: diagonal stem with three curled leaf pairs -->
    <g id="sprig">
      <path d="M -13 11 Q -3 3 11 -11" />
      <path d="M -8.5 6.5 Q -11.5 4 -10.5 0.5" />
      <path d="M -8.5 6.5 Q -6 3.5 -7.5 0" />
      <path d="M -1 -0.5 Q -4.3 -3 -3.3 -6.8" />
      <path d="M -1 -0.5 Q 1.3 -3.7 -0.7 -7" />
      <path d="M 6 -6 Q 3 -9 4.2 -12.8" />
      <path d="M 6 -6 Q 8.3 -8.8 6.2 -12.5" />
    </g>
  </defs>

  <g fill="none" stroke="#B08A4E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.17">
    <use href="#cake" transform="translate(26,84) rotate(-6) scale(0.78)" />
    <use href="#sprig" transform="translate(82,24) rotate(14) scale(0.9)" />
    <use href="#sprig" transform="translate(90,86) rotate(198) scale(0.8)" />
    <use href="#sprig" transform="translate(15,63) rotate(75) scale(0.62)" />
    <use href="#bloom" transform="translate(47,98) rotate(8) scale(0.6)" />
    <use href="#bloom" transform="translate(97,58) rotate(-25) scale(0.48)" />
    <use href="#quatrefoil" transform="translate(11,16) rotate(10) scale(0.85)" />
    <use href="#quatrefoil" transform="translate(56,47) rotate(25) scale(0.68)" />
    <use href="#quatrefoil" transform="translate(97,13) rotate(-12) scale(0.55)" />
    <use href="#quatrefoil" transform="translate(75,101) rotate(40) scale(0.6)" />
    <use href="#quatrefoil" transform="translate(15,98) rotate(60) scale(0.5)" />
    <use href="#bow" transform="translate(62,76) rotate(-10) scale(0.55)" />
  </g>

  <g fill="none" stroke="#D9AFAE" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.21">
    <use href="#quatrefoil" transform="translate(31,38) rotate(-15) scale(0.75)" />
  </g>
</svg>
