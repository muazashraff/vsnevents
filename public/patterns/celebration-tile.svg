<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <!-- tiered celebration cake: three stacked tiers, drip lines, tiny flag topper -->
    <g id="cake">
      <path d="M -14 0 Q 0 2 14 0 L 11 10 Q 0 12 -11 10 Z" />
      <path d="M -9 -9 Q 0 -7 9 -9 L 7 0 Q 0 2 -7 0 Z" />
      <path d="M -5 -17 Q 0 -15.5 5 -17 L 4 -9 Q 0 -7.5 -4 -9 Z" />
      <path d="M -13 3.5 Q 0 6.5 13 3.5" />
      <path d="M -8 -5.5 Q 0 -3 8 -5.5" />
      <line x1="0.3" y1="-17" x2="1" y2="-25" />
      <path d="M 1 -25 L 7.5 -21.5 L 1 -18.5 Z" fill="#B08A4E" stroke="none" />
    </g>

    <!-- hand-tied bloom cluster -->
    <g id="bloom">
      <path d="M -6 -14 Q -11 -12 -10 -7 Q -9 -3 -5 -4 Q -1 -5 -2 -10 Q -3 -14 -6 -14 Z" />
      <path d="M 4 -16 Q -1 -15 -1 -10 Q -1 -6 3 -6 Q 7 -7 7 -12 Q 7 -16 4 -16 Z" />
      <path d="M 0 -6 Q -6 -5 -5 0 Q -4 4 1 3 Q 6 2 5 -3 Q 4 -6 0 -6 Z" />
      <path d="M 10 -6 Q 5 -6 5 -1 Q 5 3 9 3 Q 13 2 13 -2 Q 13 -6 10 -6 Z" />
      <path d="M -5 -2 Q -3 5 -1 11" />
      <path d="M 0 0 Q 0 6 1 11" />
      <path d="M 9 -1 Q 6 5 4 11" />
      <path d="M -3.5 9 Q 1 10.5 5.5 9" />
    </g>

    <!-- striped ribbon bow -->
    <g id="bow">
      <path d="M -1.5 0 C -6 -9 -15 -8 -13.5 -1 C -12.5 3.5 -5 3 -1.5 0 Z" />
      <path d="M 1.5 0 C 6 -9 15 -8 13.5 -1 C 12.5 3.5 5 3 1.5 0 Z" />
      <path d="M -1.5 0.5 L -6 10" />
      <path d="M 1.5 0.5 L 6 10" />
      <path d="M -6 6.5 L -4.3 8.7" />
      <path d="M 6 6.5 L 4.3 8.7" />
      <circle cx="0" cy="0.5" r="2.3" />
      <path d="M -9 -4 L -6.5 -6.5" />
      <path d="M -6 -1.5 L -3.5 -4" />
      <path d="M 9 -4 L 6.5 -6.5" />
      <path d="M 6 -1.5 L 3.5 -4" />
    </g>

    <!-- tiny quatrefoil accent dot -->
    <g id="quatrefoil">
      <path d="M 0 -4.5 C 2.4 -2.4 2.4 2.4 0 4.5 C -2.4 2.4 -2.4 -2.4 0 -4.5 Z" />
      <path d="M -4.5 0 C -2.4 -2.4 2.4 -2.4 4.5 0 C 2.4 2.4 -2.4 2.4 -4.5 0 Z" />
    </g>
  </defs>

  <g fill="none" stroke="#B08A4E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.11">
    <use href="#cake" transform="translate(40,102) rotate(-4)" />
    <use href="#bloom" transform="translate(116,42) rotate(6) scale(0.95)" />
    <use href="#bow" transform="translate(96,127) rotate(-8) scale(0.95)" />
    <use href="#quatrefoil" transform="translate(21,29) rotate(15) scale(1.15)" />
    <use href="#quatrefoil" transform="translate(71,62) rotate(30) scale(0.8)" />
    <use href="#cake" transform="translate(139,150) rotate(10) scale(0.5)" />
  </g>

  <g fill="none" stroke="#D9AFAE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.16">
    <use href="#quatrefoil" transform="translate(141,99) rotate(-20) scale(0.95)" />
  </g>
</svg>
